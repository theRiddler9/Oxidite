[package]
name = "oxidite"
version = "0.1.0"
edition = "2024"
description = "A cross-platform terminal emulator written in Rust"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
portable-pty = "0.9.0"
thiserror = "2.0.21"
vte = "0.15.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
