[package]
name = "oxidite"
version = "0.1.0"
edition = "2024"
description = "A cross-platform terminal emulator written in Rust"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.8.0"
portable-pty = "0.9.0"
thiserror = "2.0.21"
unicode-width = "0.2.0"
vte = "0.15.0"
glyphon = "0.12.0"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"
arboard = "3.4.1"
dirs = "6.0"
env_logger = "0.11"
log = "0.4"
notify = "8.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[[bench]]
name = "throughput"
harness = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
