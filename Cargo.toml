[package]
name = "oxidite"
version = "0.1.0"
edition = "2024"
description = "A cross-platform terminal emulator written in Rust"
license = "MIT"
readme = "README.md"

[dependencies]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
