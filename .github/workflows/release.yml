name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: oxidite
            asset_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: oxidite
            asset_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: oxidite
            asset_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: oxidite.exe
            asset_ext: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging/themes
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} staging/
          cp README.md LICENSE config.example.toml staging/
          cp -r themes/* staging/themes/
          cd staging
          tar -czf ../oxidite-${{ matrix.target }}.tar.gz *
          cd ..

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging\themes | Out-Null
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.bin }} -Destination staging\
          Copy-Item README.md, LICENSE, config.example.toml -Destination staging\
          Copy-Item themes\* -Destination staging\themes\
          Compress-Archive -Path staging\* -DestinationPath oxidite-${{ matrix.target }}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oxidite-${{ matrix.target }}.${{ matrix.asset_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
